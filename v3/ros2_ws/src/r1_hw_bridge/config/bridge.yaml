# Bridge defaults. Gains are the ones to argue about before the first hanging
# run; everything else is protocol.
/**:
  ros__parameters:
    iface: "eth10"           # measured in stage 2; `ip -brief addr` to confirm
    dds_domain: 0
    control_rate_hz: 50.0    # must equal the policy's; it is what training used
    cmd_rate_hz: 500.0       # motor bus rate; the PD loop itself is in firmware
    enable_output: false     # SAFETY: opt in, never default
    check_state_crc: true
    # Gains are per joint, from the training config (see kKp/kKd in
    # joint_map.hpp, generated from interface/actuator_gains.json). These only
    # scale them, and 1.0 IS the trained controller -- ramp with kp_scale so the
    # endpoint of the ramp is a known quantity instead of a guessed number.
    kp_scale: 1.0
    kd_scale: 1.0            # also the damping used in the degraded state
    lowstate_timeout_ms: 100.0
    target_timeout_ms: 60.0  # 3 control cycles at 50 Hz
    min_control_rate_hz: 45.0
    auto_recover: false      # recovery is explicit, via ~/resume
    # Velocity commands arrive on ~/cmd_vel as [vx, vy, wz] and go STRAIGHT into
    # the velocity_commands observation term. Nothing downstream checks them: the
    # policy cannot signal "I was not trained for this", it just emits confident
    # joint targets for a state it has never seen.
    cmd_vel_timeout_ms: 500.0   # deadman: stale commands decay to zero, not hold
    # The envelope below is what training actually covered -- the end point of
    # W04's command curriculum (COMMAND_RANGES_FINAL, tasks/r1_flat/flat_env_cfg.py).
    # It is not a comfort limit.
    #   vx  forward only, up to 1.0 m/s. Reverse was never trained.
    #   vy  pinned to 0 for ALL of training. Sideways is not weakly trained, it
    #       does not exist in the distribution -- so it is refused, not clamped.
    #   wz  turning both ways, +-0.5 rad/s.
    # Widen only for a deliberate out-of-distribution experiment.
    # V3: the policy is v2 (models/v2_drift_ft), so these are v2's trained ranges
    # (COMMAND_RANGES_FINAL_V2, tasks/r1_flat/flat_v2_env_cfg.py) -- what
    # policy_pack's install_bundle.sh writes for the v2 bundle. The notes above
    # describe v1.
    cmd_vel_x_range: [-0.6, 1.0]
    cmd_vel_y_range: [-0.5, 0.5]
    cmd_vel_yaw_range: [-1.57, 1.57]

    # ---- V3 proximity reflex (reflex_fsm.hpp; v3/README.md) --------------------------
    # SAFETY: opt in. Off, none of its topics exist and the observation is built as
    # before. On, it needs /r1_perception/proximity: without frames, forward walking
    # is blocked. Every value below is also the default of reflex::Config and of
    # v3/reflex/reflex.py (v3/reflex/test_reflex.py checks the three agree).
    reflex_enable: false
    reflex_proximity_topic: "/r1_perception/proximity"
    reflex_log: ""                    # a path: one CSV line per control step
    # retreat: on confirm_frames consecutive frames with a person or an obstacle nearer
    # than its trigger, (retreat_vx, 0, 0) for retreat_s, then stand until ~/reflex_reset
    reflex_person_trigger_m: 0.6
    reflex_obstacle_trigger_m: 0.45
    reflex_confirm_frames: 2
    reflex_retreat_vx: -0.3          # inside cmd_vel_x_range, or the node refuses to start
    reflex_retreat_s: 1.5            # 0.33 m from standing in simulation
    reflex_clear_margin_m: 0.2       # in STAND: away beyond trigger + this before another
    reflex_max_retreats: 2           # per window; then stand, latched until a reset
    reflex_window_s: 10.0
    # forward blocked: stale frames, no depth, a hole in the depth image's center, or
    # anything inside the stop distance
    #   stop(v) = max(floor, trigger + stop_margin + k_lat * v * latency + k_brake * brake(v))
    # with brake(v) the v2 policy's worst simulated braking distance and v the largest
    # forward command of the last speed_window_s
    reflex_stale_s: 0.3
    reflex_center_valid_min: 0.2     # PROBE: on the robot, with something against the camera
    reflex_release_margin_m: 0.10
    reflex_person_floor_m: 1.2
    reflex_obstacle_floor_m: 0.6
    reflex_stop_margin_m: 0.10
    reflex_latency_s: 0.25           # PROBE: replace with the measured p99 (the bridge logs it)
    reflex_k_lat: 1.5
    reflex_k_brake: 1.3
    reflex_speed_window_s: 1.0
